name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr-branch: ${{ steps.branch.outputs.name }}
    steps:
      # RELEASE_PLEASE_TOKEN must be created as a repository secret holding a
      # PAT with `contents: write` and `pull-requests: write`. The default
      # GITHUB_TOKEN cannot be used: events it produces do not start other
      # workflows, so the `v*` tag it pushes would never trigger goreleaser.yml
      # and no plugin tarballs would be attached to the release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Guarded by `if` rather than folded into the job output expression: the
      # `pr` output is empty on the runs that only tag a release, and fromJSON
      # fails on an empty string.
      - id: branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

  # release-please only knows how to rewrite the version it finds in VERSION.
  # Everything else that carries the version is generated: the Go SDK embeds it
  # in a `semver.MustParse` call, and the npm lock file feeds npmDepsHash in
  # flake.nix. Regenerate the lot on the release branch so the release PR is
  # self-consistent and its own CI run passes; pushing with the PAT is what
  # makes that run start.
  regenerate:
    needs: release-please
    if: needs.release-please.outputs.pr-branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.pr-branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: unstoppablemango
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix develop -c make generate npm_deps

      - name: Commit regenerated SDKs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sdk flake.nix provider/cmd/pulumi-resource-git/schema.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: regenerate SDKs for the release'
          git push
