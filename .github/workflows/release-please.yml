name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # RELEASE_PLEASE_TOKEN must be created as a repository secret holding a
      # PAT with `contents: write` and `pull-requests: write`. The default
      # GITHUB_TOKEN cannot be used: events it produces do not start other
      # workflows, so the `v*` tag it pushes would never trigger goreleaser.yml
      # and no plugin tarballs would be attached to the release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
