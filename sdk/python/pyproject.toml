[project]
  name = "pulumi_git"
  description = "A Pulumi package for declaring and reconciling the state of git repositories."
  dependencies = ["parver>=0.2.1", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["git", "patch", "category/utility"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.0.1"
  [project.license]
    text = "MIT"
  [project.urls]
    Homepage = "https://github.com/UnstoppableMango/pulumi-provider-git"
    Repository = "https://github.com/UnstoppableMango/pulumi-provider-git"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_git = ["py.typed", "pulumi-plugin.json"]
