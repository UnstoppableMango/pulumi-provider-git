name: Release

# release-please pushes the `v*` tag when its release PR merges, which is what
# starts this job. The archives it uploads are the only way consumers get the
# plugin: Pulumi resolves it from the GitHub release named by the tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # provider/ is a nested module; the root has no go.mod.
          go-version-file: provider/go.mod

      # Loads the release signing key into a gpg-agent that already holds the
      # passphrase, so the `signs` block in .goreleaser.yml can run --batch.
      # Both secrets are the decrypted fields of secrets/gpg-release-key.enc.yaml;
      # see the README for the sops command that (re)sets them.
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
